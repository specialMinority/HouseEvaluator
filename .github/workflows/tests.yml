name: Offline regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} offline regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.14']
    env:
      SUUMO_LIVE: '0'
      HOUSE_EVALUATOR_DEMO: '0'
      HOUSE_EVALUATOR_LEGACY: '0'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install test runner
        run: python -m pip install pytest==9.0.2
      - name: Run fixed-fixture and local HTTP tests
        run: python -m pytest -q

  javascript:
    name: Browser JavaScript syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: node --check frontend/v2/app.js
      - run: node --check frontend/v2/personal.js
